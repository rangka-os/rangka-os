# Copy to .github/workflows/release.yml. On a v* tag: test, build binaries + Docker image (goreleaser),
# then publish @rangka-os/cli, its platform packages and @rangka-os/create to npm.
# Needs the repository secret NPM_TOKEN (an npm automation token with publish rights on @rangka-os).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write    # GitHub Release
  packages: write    # ghcr.io image
  id-token: write    # npm provenance

jobs:
  release:
    # Same runner as kernel.yml: ubuntu-latest (26.04) hangs headless Chromium (DBus) and lacks the
    # Python packages the tests compare against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {path: rangka-os, fetch-depth: 0}
      - uses: actions/checkout@v7
        with: {repository: rangka-os/rangka-apps, path: rangka-apps}
      - uses: actions/checkout@v7
        with: {repository: rangka-os/rangka-connectors, path: rangka-connectors}

      - uses: actions/setup-go@v7
        with: {go-version-file: rangka-os/kernel/go.mod}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install Python packages
        run: python -m pip install jsonschema referencing pyyaml
      - name: Test (no database)
        working-directory: rangka-os/kernel
        run: go test ./...
      - uses: actions/setup-node@v7
        with: {node-version: 20, registry-url: 'https://registry.npmjs.org'}
      # Before goreleaser publishes anything: the starter must stage and its templates validate (npm.yml).
      - name: Check the npm starter
        run: make -C rangka-os/kernel build && rangka-os/npm/scripts/check-staged.sh
      # Contract 0035: every skill (platform, apps, modules, connectors) as one zip on the GitHub Release, for harnesses
      # without the CLI: unzip -d .claude/skills. pack refuses when a skill fails rangka skills check.
      - name: Pack the skills
        run: rangka-os/kernel/bin/rangka skills pack --apps rangka-apps/apps --modules rangka-apps/modules --connectors rangka-connectors --out "rangka-os/dist-skills/rangka-skills-${GITHUB_REF_NAME#v}.zip"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}

      - uses: goreleaser/goreleaser-action@v7
        with: {distribution: goreleaser, version: '~> v2', args: release --clean, workdir: rangka-os}
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}

      - name: Stage npm packages
        working-directory: rangka-os
        run: node npm/scripts/stage.mjs --version "${GITHUB_REF_NAME#v}" --dist dist
      - name: Publish to npm
        working-directory: rangka-os
        run: node npm/scripts/publish.mjs --provenance
        env: {NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'}
