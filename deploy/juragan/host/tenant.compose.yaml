# One tenant = one compose project TENANT_PROJECT (juragan-t-<id> on the production host, <HOST_PROJECT>-t-<id> on any
# other) with one kernel. tenantctl runs it with
#   --env-file <host .env> --env-file $HOST_DIR/registry/<id>.env --env-file $HOST_DIR/secrets/<id>.env
# registry/<id>.env: TENANT_ID, TENANT_ORG, TENANT_HOST, TENANT_PROJECT, RANGKA_TAG (the tenant's own pin);
# secrets/<id>.env: DB_PASSWORD. The kernel is only on the tenant's own network, named like the project (made by
# tenantctl), which the shared Postgres (alias postgres) and Caddy join: one tenant cannot reach another tenant's kernel.
services:
  kernel:
    build:
      context: ./kernel
      target: ${KERNEL_TARGET:-pdf}
      args:
        RANGKA_TAG: ${RANGKA_TAG:?}
    image: juragan-tenant-kernel:${RANGKA_TAG:?}-${KERNEL_TARGET:-pdf}
    init: true
    shm_size: 256m
    mem_limit: ${KERNEL_MEM_LIMIT:-768m}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://${TENANT_ID:?}:${DB_PASSWORD:?}@postgres:5432/${TENANT_ID:?}?sslmode=disable
      RANGKA_ORG: ${TENANT_ORG:?}
      RANGKA_APPS: /srv/apps
      RANGKA_SITE: /srv/site
      RANGKA_MODULES: /srv/modules
      RANGKA_CONNECTORS: /srv/connectors
      RANGKA_DEPLOY_TARGET: docker
      RANGKA_ENV: production
      RANGKA_BACKUP_DIR: /srv/backups
      RANGKA_ADDR: ":8080"
      RANGKA_PDF_CONCURRENCY: ${RANGKA_PDF_CONCURRENCY:-1}
      RANGKA_AI_URL: ${RANGKA_AI_URL:-}
      RANGKA_AI_SECRET: ${RANGKA_AI_SECRET:-}
      # connectors of a hosted company reach only public addresses (contract 0017 §5); list internal CIDRs a
      # connector must still reach in RANGKA_CONNECTOR_EGRESS_ALLOW
      RANGKA_CONNECTOR_EGRESS: public
      RANGKA_CONNECTOR_EGRESS_ALLOW: ${RANGKA_CONNECTOR_EGRESS_ALLOW:-}
    volumes:
      - ${HOST_DIR:?}/tenants/${TENANT_ID:?}:/srv
    networks:
      tenants:
        aliases: ["t-${TENANT_ID:?}"]

networks:
  tenants:
    name: ${TENANT_PROJECT:?}
    external: true
