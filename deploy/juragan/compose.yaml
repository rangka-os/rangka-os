# juragan.ai: two Rangka pilots (jasa, fnb) on one VM. Secrets come from .env (see .env.example).
name: juragan

x-kernel: &kernel
  image: ${RANGKA_IMAGE:-ghcr.io/rangka-os/rangka:${RANGKA_TAG:?set RANGKA_TAG to a pinned release}}
  restart: unless-stopped
  command: ["serve"]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      JASA_DB_PASSWORD: ${JASA_DB_PASSWORD:?}
      FNB_DB_PASSWORD: ${FNB_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck: # TCP only: the init-time server listens on the socket alone, so healthy means init is done
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  jasa:
    <<: *kernel
    environment:
      DATABASE_URL: postgres://jasa:${JASA_DB_PASSWORD:?}@postgres:5432/jasa?sslmode=disable
      RANGKA_ORG: ${JASA_ORG:?}
      RANGKA_APPS: /srv/apps
      RANGKA_SITE: /srv/site
      RANGKA_DEPLOY_TARGET: docker
      RANGKA_ADDR: ":8080"
      RANGKA_OWNER_EMAIL: ${RANGKA_OWNER_EMAIL:-}
      RANGKA_OWNER_PASSWORD: ${RANGKA_OWNER_PASSWORD:-}
    volumes:
      - ${PILOTS_DIR:?}/jasa:/srv

  fnb:
    <<: *kernel
    environment:
      DATABASE_URL: postgres://fnb:${FNB_DB_PASSWORD:?}@postgres:5432/fnb?sslmode=disable
      RANGKA_ORG: ${FNB_ORG:?}
      RANGKA_APPS: /srv/apps
      RANGKA_SITE: /srv/site
      RANGKA_DEPLOY_TARGET: docker
      RANGKA_ADDR: ":8080"
      RANGKA_OWNER_EMAIL: ${RANGKA_OWNER_EMAIL:-}
      RANGKA_OWNER_PASSWORD: ${RANGKA_OWNER_PASSWORD:-}
    volumes:
      - ${PILOTS_DIR:?}/fnb:/srv

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      JASA_HOST: ${JASA_HOST:?}
      FNB_HOST: ${FNB_HOST:?}
      CADDY_TLS: ${CADDY_TLS:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - jasa
      - fnb

volumes:
  pgdata:
  caddy_data:
