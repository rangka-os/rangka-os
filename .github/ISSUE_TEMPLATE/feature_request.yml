name: Feature request
description: Suggest something Rangka OS should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you or the business trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. A sketch of the `.rk` file, API or screen helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contract
    attributes:
      label: Scope
      options:
        - label: This changes a `.rk` format or an API that other repositories read (it needs a contract proposal in docs/contracts/).
