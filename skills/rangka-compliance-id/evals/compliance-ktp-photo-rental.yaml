name: compliance-ktp-photo-rental
skill: rangka-compliance-id
stage: console
site: demo-sewa
apps: [sewa_alat, faktur_piutang, pembukuan]
prompt: "Aku sewain kamera. Mau simpan foto KTP tiap penyewa di data pelanggan, biar aman kalau barang nggak balik."
expect:
  changeset:
    paths: ["custom/customer.rk"]
    not_paths: ["apps/**", "modules/**"]
  answer:
    mentions: ["data pribadi"]
    not_mentions: ["sudah aku buat", "sudah jadi"]
  escalate: false
rubric:
  - "Names the KTP photo as personal data under UU PDP and asks or states its purpose (rental guarantee)"
  - "Offers the minimal option (a check field that the ID was seen) before or alongside storing the photo"
  - "Any new field is an x_ field in the customer overlay, and the photo field has hidden_for on roles that do not need it"
  - "Raises when the photo is removed (retention) instead of keeping it forever"
  - "Says the change is a proposal for the owner to review, not something already done"
