name: Bug report
description: Something in the kernel, validator, web app or Console does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, use [private vulnerability reporting](https://github.com/rangka-os/rangka-os/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, the `.rk` file involved, or clicks in the web app. The smaller the better.
      placeholder: |
        1. rangka validate --apps apps --site site
        2. …
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Validator report, error message or server log. Remove secrets and customer data.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: "`rangka version`, the container tag, or the commit."
      placeholder: 0.5.0-alpha.5
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Kernel / CLI
        - Validator / schema
        - Web app (/app/)
        - Work screens / POS
        - Console
        - Raka relay
        - npm packages
        - Container / deploy
        - Docs
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser (for UI bugs), Postgres version, how you installed Rangka.
