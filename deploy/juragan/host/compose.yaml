# juragan.ai tenant host: one Postgres and one Caddy shared by many tenants. Each tenant is its own compose project
# (tenant.compose.yaml, project juragan-t-<id>) with one kernel on a network of its own that Postgres and Caddy join. Managed by ./tenantctl;
# see README.md. Secrets come from .env (see host.env.example) and from $HOST_DIR/secrets/<id>.env (written by tenantctl).
name: ${HOST_PROJECT:-juragan-host}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    # each kernel pools up to 10 connections (system.rk db.pool) and each tenant role is capped (TENANT_CONNECTION_LIMIT)
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [tenants]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOST_DIR:?}/caddy:/etc/caddy/tenants:ro
      - caddy_data:/data
    networks: [tenants]

  # Backups and restore: `tenantctl backup` / `tenantctl drill` run it; never started by `up`.
  backup:
    profiles: ["tools"]
    logging: *logging
    build:
      context: ..
      dockerfile: host/backup/Dockerfile
      args:
        KERNEL_IMAGE: juragan-tenant-kernel:${RANGKA_TAG:?}-slim
    image: juragan-host-backup:${RANGKA_TAG:?}
    init: true
    environment:
      BACKUP_DB_HOST: postgres
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ALLOW_PLAINTEXT: ${BACKUP_ALLOW_PLAINTEXT:-0}
      BACKUP_KEEP_LOCAL: ${BACKUP_KEEP_LOCAL:-7}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      BACKUP_METHOD: ${BACKUP_METHOD:-pg_dump}
      RANGKA_TAG: ${RANGKA_TAG:-}
      BACKUP_RCLONE_RETRIES: ${BACKUP_RCLONE_RETRIES:-3}
      BACKUP_RCLONE_LOW_LEVEL_RETRIES: ${BACKUP_RCLONE_LOW_LEVEL_RETRIES:-10}
      BACKUP_RCLONE_CONTIMEOUT: ${BACKUP_RCLONE_CONTIMEOUT:-30s}
      RCLONE_CONFIG_OFFBOX_TYPE: ${RCLONE_CONFIG_OFFBOX_TYPE:-s3}
      RCLONE_CONFIG_OFFBOX_PROVIDER: ${RCLONE_CONFIG_OFFBOX_PROVIDER:-}
      RCLONE_CONFIG_OFFBOX_REGION: ${RCLONE_CONFIG_OFFBOX_REGION:-}
      RCLONE_CONFIG_OFFBOX_ENDPOINT: ${RCLONE_CONFIG_OFFBOX_ENDPOINT:-}
      RCLONE_CONFIG_OFFBOX_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFBOX_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFBOX_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFBOX_SECRET_ACCESS_KEY:-}
    volumes:
      - ${HOST_DIR:?}/tenants:/pilots:ro
      - ${HOST_DIR:?}/backups:/backups
      # rclone type local (tests, or a mounted disk): the off-box folder; unused with s3
      - ${OFFBOX_LOCAL_DIR:-/nonexistent}:/offbox
    networks: [tenants]

networks:
  tenants:
    name: ${HOST_NETWORK:-juragan-tenants}

volumes:
  pgdata:
  caddy_data:
