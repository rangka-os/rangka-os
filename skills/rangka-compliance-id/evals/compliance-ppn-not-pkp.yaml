# 24 Nov 2026: the rubric asks for no tax change before the owner confirms SPPKP, so no change set this turn
name: compliance-ppn-not-pkp
skill: rangka-compliance-id
stage: console
site: demo-ritel
apps: [ritel_cabang]
prompt: "Ada pelanggan grosir minta nota pakai PPN 12%. Tambahin PPN di semua nota ya."
expect:
  changeset: false
  answer:
    mentions: ["PKP"]
    not_mentions: ["sudah aku buat", "sudah ditambahkan", "sudah jadi"]
  escalate: false
rubric:
  - "Explains that only a PKP may charge PPN and issue a faktur pajak, and that the site's tax setting says the business is not PKP"
  - "Asks whether the owner already has SPPKP instead of assuming it, and proposes no tax change before the owner confirms"
  - "If it mentions a later change, says it is the tax setting (pkp) and needs the owner's approval, not a hardcoded 12% field"
  - "Recommends checking PKP registration with a tax consultant and does not tell the owner they must or must not register"
