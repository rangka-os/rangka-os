<!doctype html>
<html lang="id" data-brand="juragan">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rangka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="../design-system/bundle.css">
<link rel="stylesheet" href="../canvas/canvas.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--app); color: var(--ink); font: 14px/20px var(--font-sans); }
  #rk-app { height: 100%; }
  /* app shell (shell.js): .ap-side = side-only (Frappe sidebar), .ap-top = top-nav */
  .ap-shell { height: 100%; min-height: 0; box-sizing: border-box; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .ap-shell > .rk-side { height: auto; min-height: 0; overflow-y: auto; }
  .ap-shell > .rk-side nav { flex: 0 0 auto; overflow: visible; }
  .ap-side > .rk-side nav { flex: 1 0 auto; } /* footer and collapse sit at the bottom */
  .ap-side-foot { padding: 8px; flex-wrap: wrap; }
  .ap-side-foot .ap-ask { flex: 1 0 100%; justify-content: flex-start; }
  .ap-shell .rk-side-foot.collapsed { flex-direction: column; gap: 4px; }
  .ap-ask .rk-icon { color: var(--raka); } /* Raka's teal: only on the Tanya Raka entries */
  .ap-shell .rk-shell-main { min-height: 0; }
  .ap-main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .ap-main > .rk-shell-content, .ap-main > .rk-pagehead { box-sizing: border-box; width: 100%; }
  .ap-menu-btn, .ap-nav-scrim, .ap-mhead { display: none; }
  .ap-mhead-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .ap-switch-menu .rk-menu { width: var(--menu-w); }
  .ap-splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--muted); padding: 24px; box-sizing: border-box; }
  .ap-splash > .rk-alert { max-width: 480px; }
  .ap-muted { margin: 0; color: var(--muted); }
  .ap-signin { min-height: 100%; }
  .ap-signin-form { display: flex; flex-direction: column; gap: 16px; }
  .ap-signin-dialog { width: min(var(--dialog-w), calc(100vw - 32px)); }
  .ap-signin-dialog .rk-dialog-main { display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 601px) and (max-width: 860px) {
    /* side-only keeps its sidebar down to phone width (the design system hides it at 860px for the top-nav shell) */
    .ap-shell.ap-side { grid-template-columns: var(--sidebar) minmax(0, 1fr); }
    .ap-shell.ap-side > .rk-side { display: flex; }
  }
  @media (max-width: 860px) {
    .ap-top { height: auto; min-height: 100%; }
    .ap-top .ap-main { overflow: visible; }
    .ap-top .ap-menu-btn { display: inline-flex; }
    .ap-top.ap-nav-open > .rk-side { display: flex; position: fixed; z-index: 40; top: var(--topbar); left: 0; bottom: 0; width: min(300px, 86vw); box-shadow: var(--shadow-overlay); overflow-y: auto; }
    .ap-top.ap-nav-open > .ap-nav-scrim { display: block; position: fixed; inset: var(--topbar) 0 0 0; background: var(--scrim); z-index: 39; }
  }
  @media (max-width: 600px) {
    /* side-only on a phone: a 48px bar with the menu button, the sidebar as a drawer over the page */
    .ap-side { height: auto; min-height: 100%; }
    .ap-side .ap-main { overflow: visible; }
    .ap-side .ap-mhead { display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 8px; box-sizing: border-box; position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
    .ap-side .ap-menu-btn { display: inline-flex; }
    .ap-side.ap-nav-open > .rk-side { display: flex; position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; width: min(300px, 86vw); box-shadow: var(--shadow-overlay); overflow-y: auto; }
    .ap-side.ap-nav-open > .ap-nav-scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 39; }
  }
  @media (max-width: 640px) {
    .ap-shell .rk-topnav-end .rk-iconbtn[aria-label="Bantuan"], .ap-shell .rk-topnav-end .rk-iconbtn[aria-label="Notifikasi"] { display: none; }
    .ap-shell .rk-topnav > .rk-iconbtn[aria-label="Pindah aplikasi"] { display: none; }
  }
  /* form view (fields.js, form.js) */
  .ap-printmenu { position: relative; display: inline-flex; }
  .ap-printmenu-pop { position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; }
  /* import wizard (import.js): intro, steps, then flat sections like the document page */
  .ap-imp { display: flex; flex-direction: column; gap: 16px; }
  .ap-imp-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .ap-imp-sec .ap-muted + .ap-imp-tw, .ap-imp-sec .ap-muted + .rk-alert { margin-top: 8px; }
  .ap-imp-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .ap-imp-sum { margin: 0 0 4px; }
  .ap-imp-tw { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
  .ap-imp-link { color: var(--link); }
  .ap-imp .rk-field { max-width: 360px; margin-bottom: 12px; }
  .ap-att { margin-top: 16px; }
  .ap-att-zone { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px; margin-bottom: 12px; border: 1px dashed var(--border); border-radius: var(--r-lg); background: var(--soft); }
  .ap-att-zone.on { background: var(--selected); border-color: var(--selected-ink); }
  .ap-att-input { display: none; }
  .ap-att-empty { padding: 4px 0; }
  .ap-att-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .ap-att-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
  .ap-att-row:first-child { border-top: 0; }
  .ap-att-open { flex: 0 0 auto; display: block; line-height: 0; }
  .ap-att-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--soft); }
  .ap-att-icon { width: 40px; height: 40px; box-sizing: border-box; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--soft); color: var(--muted); font: 600 9px/10px var(--font-sans); }
  .ap-att-icon .rk-icon { width: 16px; height: 16px; }
  .ap-att-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .ap-att-name { color: var(--link); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-fw { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ap-fw > .rk-field { gap: inherit; }
  .ap-link { min-width: 0; }
  .ap-canvas-wrap { height: calc(100vh - var(--header) - 1px); min-height: 480px; }
  .ap-proc-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; max-width: 640px; border-top: 1px solid var(--line); }
  .ap-proc-list > li { border-bottom: 1px solid var(--line); }
  .ap-proc-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: var(--r); color: var(--ink); text-decoration: none; min-height: 40px; box-sizing: border-box; }
  .ap-proc-item:hover { background: var(--hover); }
  .ap-proc-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .ap-proc-item b { flex: 1; font-weight: 500; }
  .ap-check { justify-content: flex-end; }
  .ap-grid-link { min-width: 220px; }
  .ap-gl { display: flex; flex-direction: column; min-width: 0; }
  .ap-gl-pop { list-style: none; margin: 2px 0 0; padding: 4px; max-height: 220px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md); box-shadow: var(--shadow-pop); }
  .ap-gl-opt { display: flex; flex-direction: column; gap: 0; padding: 8px; min-height: 40px; box-sizing: border-box; justify-content: center; border-radius: var(--r-sm); cursor: pointer; }
  .ap-gl-opt small { color: var(--muted); font-size: 12px; line-height: 16px; }
  .ap-gl-opt:hover { background: var(--hover); }
  .ap-gl-opt.on { background: var(--selected); color: var(--selected-ink); }
  .ap-gl-note { padding: 8px; color: var(--muted); }
  .ap-main .rk-grid-scroll { position: relative; } /* keeps the visually hidden "Aksi" header inside the scroller */
  .ap-grid-empty { color: var(--muted); text-align: center; padding: 12px; }
  .ap-ro-grid { margin-top: 24px; }
  .ap-form-fields { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; }
  /* document page (form.js): sections as titled groups divided by line, a two-column grid from 900px, the side panel */
  .ap-docmain { display: flex; flex-direction: column; gap: 16px; padding-right: 24px; }
  .ap-docsec { padding: 16px 0 20px; border-bottom: 1px solid var(--line); min-width: 0; }
  .ap-docsec:first-child { padding-top: 4px; }
  .ap-docsec:last-child { border-bottom: 0; }
  .ap-docsec-t { margin: 0 0 12px; font: 600 var(--font-size)/var(--line-height) var(--font-sans); color: var(--ink); }
  .ap-docgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px 24px; }
  .ap-docgrid > * { min-width: 0; }
  .ap-docgrid > .ap-span { grid-column: 1 / -1; }
  @media (min-width: 900px) { .ap-docgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .rk-docpanel-sec:has(> .rk-docpanel-body:empty) { display: none; } /* a section whose content chose to show nothing */
  .rk-docpanel .rk-steps { margin-bottom: 12px; }
  .ap-docinfo { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .ap-docinfo > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; }
  .ap-docinfo dt { color: var(--muted); }
  .ap-docinfo dd { margin: 0; color: var(--ink); min-width: 0; }
  .ap-docprint { display: flex; flex-wrap: wrap; gap: 8px; }
  .ap-att-panel .ap-att-zone { padding: 8px; margin-bottom: 8px; }
  .ap-approvals-panel .ap-banner { display: flex; flex-direction: column; gap: 4px; }
  .ap-approvals-panel .ap-banner + .ap-banner { border-top: 1px solid var(--line); padding-top: 8px; }
  .ap-banner-t { display: flex; align-items: center; gap: 6px; color: var(--warn); font-weight: 600; }
  .ap-banner-t .rk-icon { flex: none; }
  .ap-approvals-panel .ap-decide { margin-top: 4px; }
  .ap-morebtn { border: 1px solid var(--border); background: var(--surface); }
  @media (max-width: 1100px) { .ap-docmain { padding-right: 0; } .rk-docpanel { margin-top: 8px; } }
  .ap-main .rk-desc a, .ap-main .pv-ro a, .ap-docinfo a { color: var(--link); text-decoration: none; }
  .ap-main .rk-desc a:hover, .ap-main .pv-ro a:hover, .ap-docinfo a:hover { text-decoration: underline; }
  .ap-errlist { margin: 4px 0 0; padding-left: 18px; }
  .ap-main .rk-dialog-body .ap-errlist { margin-bottom: 8px; }
  @media (max-width: 600px) {
    .ap-main .rk-pagehead-extra { width: 100%; flex-wrap: wrap; }
    .ap-grid-link { min-width: 180px; }
    /* phone: every button and field is at least 40px tall (links stay inline) */
    body button, body [role=button], body select, body textarea, body input:not([type=checkbox]):not([type=radio]):not([type=file]) { min-height: 40px; }
    body .rk-iconbtn { min-width: 40px; }
    body .rk-select-btn, body .rk-btn, body .rk-iconbtn { height: auto; min-height: 40px; }
    body .rk-seg button, body .rk-pager button { min-height: 40px; }
    /* a filter's list opens under the whole bar at full width: anchored to its button it ran past the screen edge */
    .ap-main .rk-filterbar { position: relative; }
    .ap-main .rk-fwrap { position: static; }
    .ap-main .rk-fpop { left: 0; right: 0; width: auto; }
  }
  /* dashboards (dashboard.js): 16px gaps between the 8px cards */
  .ap-main .rk-dash { gap: 16px; }
  /* approvals (approvals.js) */
  .ap-approvals { display: flex; flex-direction: column; gap: 8px; }
  .ap-banner-meta { font-weight: 600; }
  .ap-decide { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ap-reason { display: flex; flex-direction: column; gap: 12px; }
  .ap-reason textarea { width: 100%; box-sizing: border-box; }
  .ap-main .rk-tabs { margin-bottom: 0; }
  .ap-inbox { list-style: none; margin: 0; padding: 0; }
  .ap-inbox-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ap-inbox-row:first-child { padding-top: 4px; }
  .ap-inbox-row:last-child { border-bottom: 0; }
  .ap-inbox-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 280px; }
  .ap-inbox-doc { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 600; }
  .ap-inbox-doc a { color: var(--link); text-decoration: none; overflow-wrap: anywhere; }
  .ap-inbox-doc a:hover { text-decoration: underline; }
  .ap-inbox-reason { color: var(--ink-2); overflow-wrap: anywhere; }
  .ap-inbox .ap-muted { font-size: 12px; line-height: 16px; overflow-wrap: anywhere; }
  /* Ubah mode (ubah.js, shell.js and the per-view affordances); Bata marks everything that edits the app */
  .ap-ubah-mode { display: inline-flex; padding: 2px; border-radius: var(--r); background: var(--neutral); flex-shrink: 0; }
  .ap-ubah-mode button { min-height: 28px; border: 0; background: transparent; border-radius: var(--r-sm); padding: 0 10px; font: 500 14px/28px var(--font-sans); color: var(--ink-2); cursor: pointer; }
  .ap-ubah-mode button:hover { color: var(--ink); }
  .ap-ubah-mode button[aria-pressed="true"] { background: var(--surface); color: var(--selected-ink); box-shadow: var(--shadow-seg); }
  .ap-ubah-mode button:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .ap-ubah-bar, .ap-ubah-preview { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 20px; min-height: 40px; box-sizing: border-box; font: 500 var(--font-size)/var(--line-height) var(--font-sans); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .ap-ubah-bar { background: var(--selected); color: var(--selected-ink); }
  .ap-ubah-bar > .rk-icon, .ap-ubah-preview > .rk-icon { width: 16px; height: 16px; flex: none; }
  .ap-ubah-bar-t, .ap-ubah-preview-t { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .ap-ubah-bar .rk-btn { color: var(--selected-ink); }
  .ap-ubah-preview { background: var(--info-tint); color: var(--ink); }
  .ap-ubah-preview > .rk-icon { color: var(--info); }
  .ap-ubah-tools { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .ap-ubah-handle { display: inline-flex; color: var(--muted); cursor: grab; }
  /* dashboard widgets */
  .ap-ubah-w { display: flex; flex-direction: column; gap: 4px; min-width: 0; border-radius: var(--r-lg); outline: 1px dashed var(--selected-ink); outline-offset: 2px; }
  .ap-ubah-w.dragging { opacity: .5; }
  .ap-ubah-w.over { outline: 2px solid var(--focus); }
  .ap-ubah-w > :last-child { flex: 1; }
  .ap-ubah-wbar { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: var(--r); background: var(--selected); color: var(--selected-ink); cursor: grab; }
  .ap-ubah-wname { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-ubah-wname small { font-weight: 400; color: var(--muted); }
  /* list columns, kanban columns */
  .ap-ubah-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border: 1px dashed var(--selected-ink); border-radius: var(--r-lg); background: var(--selected); }
  .ap-ubah-chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 2px 2px 8px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-float); }
  .ap-ubah-chip-t { font-weight: 600; margin-right: 4px; white-space: nowrap; }
  .ap-ubah-coltools { margin-left: auto; }
  .ap-ubah-addcol { align-items: center; justify-content: center; border: 1px dashed var(--selected-ink); background: var(--selected); }
  /* form rows */
  .ap-ubah-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .ap-ubah-row { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); cursor: grab; }
  .ap-ubah-row.dragging { opacity: .5; }
  .ap-ubah-row.over { box-shadow: inset 0 2px 0 var(--focus); }
  .ap-ubah-row-t { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
  .ap-ubah-row-t small { font: 12px/16px var(--font-mono); color: var(--muted); }
  /* sidebar */
  .ap-ubah-side { border-right: 2px solid var(--selected-ink); }
  .ap-ubah-group { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 12px 0 2px; padding: 0 8px; min-height: 28px; border: 1px dashed transparent; border-radius: var(--r); background: none; font: 500 var(--font-size-sm)/16px var(--font-sans); color: var(--selected-ink); cursor: text; text-align: left; }
  .ap-ubah-group:hover { border-color: var(--selected-ink); }
  .ap-ubah-group .rk-icon { width: 12px; height: 12px; }
  .ap-ubah-rename { margin: 12px 0 2px; min-height: 28px; padding: 0 8px; font: 600 13px/20px var(--font-sans); border: 1px solid var(--focus); border-radius: var(--r); background: var(--surface); color: var(--ink); }
  .ap-ubah-navitem { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .ap-ubah-navitem > .rk-navlink { flex: 1; min-width: 0; }
  .ap-ubah-navitem .ap-ubah-tools .rk-iconbtn { width: 28px; height: 28px; }
  .ap-ubah-navadd { padding: 12px 0 0; }
  /* change-set card */
  .ap-ubah-card { position: fixed; z-index: 45; right: 16px; bottom: 16px; width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - var(--topbar) - 32px); display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-overlay); }
  .ap-ubah-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 6px 8px 0 16px; box-sizing: border-box; }
  .ap-ubah-card-head h2 { margin: 0; font: 600 14px/20px var(--font-sans); color: var(--ink); }
  .ap-ubah-card-body { padding: 8px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .ap-ubah-card-cs { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; overflow-wrap: anywhere; }
  .ap-ubah-reasons, .ap-ubah-dry { margin: 0; padding-left: 18px; color: var(--ink-2); overflow-wrap: anywhere; }
  .ap-ubah-dry .k-file { font-family: var(--font-mono); font-size: 12px; }
  .ap-ubah-sql { margin: 0; padding: 8px; max-height: 160px; overflow: auto; background: var(--soft); border: 1px solid var(--line-strong); border-radius: var(--r); font: 12px/18px var(--font-mono); white-space: pre; }
  .ap-ubah-card-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .ap-ubah-pending { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .ap-ubah-pending li + li { border-top: 1px solid var(--line); }
  .ap-ubah-pending button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; padding: 6px 8px; border: 0; border-radius: var(--r); background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .ap-ubah-pending button:hover { background: var(--hover); }
  /* dialogs */
  .ap-ubah-form { display: flex; flex-direction: column; gap: 12px; }
  .ap-ubah-tcol { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; }
  @media (max-width: 600px) {
    .ap-ubah-mode button { min-height: 40px; padding: 0 8px; }
    .ap-ubah-bar, .ap-ubah-preview { padding: 4px 16px; }
    .ap-ubah-navitem .ap-ubah-tools .rk-iconbtn { width: 40px; height: 40px; }
    .ap-ubah-group, .ap-ubah-rename { min-height: 40px; }
    .ap-ubah-card { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: calc(100vh - var(--topbar) - 16px); }
    .ap-ubah-tcol { grid-template-columns: minmax(0, 1fr); }
  }
  /* list, form and kanban styles from the prototype (pv-*), kept for the views that move over in later tasks */
  .pv-shell { height: 100%; min-height: 0; box-sizing: border-box; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .pv-shell > .rk-side { height: auto; min-height: 0; overflow-y: auto; }
  .pv-shell-main { min-height: 0; }
  .pv-main { flex: 1; min-height: 0; overflow-y: auto; }
  .pv-note { margin: 8px 8px 12px; padding: 8px 12px; border-radius: var(--r); font-size: 12px; line-height: 16px; color: var(--ink-2); background: var(--discovery-tint); }
  .pv-note b { color: var(--discovery); }
